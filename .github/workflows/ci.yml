name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the lowest version package.json supports, and the one in the Docker image
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Browser walk-through of the interface (tests/e2e.mjs): the demo in 3D and 2D, a proposal from
  # draft to approval, and no JavaScript error in the pages
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run vendor
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Builds the Docker image as the Release workflow does (without publishing it), starts it, and checks that it
  # serves the app with its vendored three.js: a dependency or action update that breaks the image fails here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: strata:ci
      - name: Start the image and check what it serves
        run: |
          docker run -d --name strata -p 8080:8080 strata:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          for f in / /vendor/three.module.js /vendor/three.core.js /vendor/OrbitControls.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$f")
            echo "$f -> $code"; test "$code" = 200
          done
      - if: failure()
        run: docker logs strata
