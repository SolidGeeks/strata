# Publishes ghcr.io/solidgeeks/strata:<version> and :latest, with a signed build provenance
# attestation, and a GitHub release, on every vX.Y.Z tag: pushed with git, or created by publishing
# a release from the GitHub web page (Releases › Draft a new release › new tag on main).
# Verify an image: gh attestation verify oci://ghcr.io/solidgeeks/strata:<version> --owner SolidGeeks
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  # Sigstore keyless signing: the workflow's OIDC identity stands in for a signing key
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the tag matches package.json
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with:
          context: .
          push: true
          tags: |
            ghcr.io/solidgeeks/strata:${{ steps.version.outputs.version }}
            ghcr.io/solidgeeks/strata:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SolidGeeks/strata
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      # Signs the image digest (not the tag, which can be moved) and stores the attestation
      # on GitHub and next to the image in ghcr.io
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/solidgeeks/strata
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The release may already exist: publishing one from the GitHub web page creates its tag,
      # which runs this workflow
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Strata $GITHUB_REF_NAME" --generate-notes --verify-tag
