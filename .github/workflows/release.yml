# Publishes ghcr.io/solidgeeks/strata:<version> and :latest, with a signed build provenance
# attestation, and a GitHub release, on every vX.Y.Z tag.
# Verify an image: gh attestation verify oci://ghcr.io/solidgeeks/strata:<version> --owner SolidGeeks
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  # Sigstore keyless signing: the workflow's OIDC identity stands in for a signing key
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches package.json
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          push: true
          tags: |
            ghcr.io/solidgeeks/strata:${{ steps.version.outputs.version }}
            ghcr.io/solidgeeks/strata:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SolidGeeks/strata
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      # Signs the image digest (not the tag, which can be moved) and stores the attestation
      # on GitHub and next to the image in ghcr.io
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/solidgeeks/strata
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Strata $GITHUB_REF_NAME" --generate-notes --verify-tag
