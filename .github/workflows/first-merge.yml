# Celebrates a contributor's first merged pull request in this repository with Bit's card.
# Pick it from "Actions → New workflow", or copy it to .github/workflows/first-merge.yml.
# The logic lives in SolidGeeks/.github (.github/workflows/first-merge.yml): fix it there, once, for every repository.
name: First merge

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  celebrate:
    # pinned by commit: it runs with pull-requests: write on pull_request_target; update the SHA after a review
    uses: SolidGeeks/.github/.github/workflows/first-merge.yml@4370254cd8fcc97ce72dbedf94a77abb99fc942e # main, 2026-11-03
