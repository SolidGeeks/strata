# Contributor License Agreement (CLA.md): each author of a pull request signs it once, with a comment on
# the pull request. Signatures are kept in signatures/cla.json on the cla-signatures branch (create it from
# main once; it stays out of main's history). pull_request_target runs with this repository's token, so this
# workflow never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/SolidGeeks/strata/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # the maintainer's accounts and bots, whose changes need no signature
          allowlist: 0b3l1X,0b3l1X-SolidGeeks,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
