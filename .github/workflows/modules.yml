# The module store: every pull request that changes its index or a module kept in this repository
# checks each listed package (download, SHA-256, manifest, loads in the restricted module process).
# A maintainer still reads the code of a new or updated module before merging (MODULES.md).
name: Modules

on:
  pull_request:
    paths:
      - docs/modules/**
      - modules/**
      - server/connectors/**
      - scripts/check-registry.mjs
  push:
    branches: [main]
    paths:
      - docs/modules/**

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-registry.mjs docs/modules/index.json
