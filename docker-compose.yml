services:
  strata:
    # Prebuilt image from GitHub (docker compose pull), or built here (docker compose up -d --build)
    image: ghcr.io/solidgeeks/strata:0.10.0
    build: .
    container_name: strata
    restart: unless-stopped
    env_file: .env
    volumes:
      - strata-data:/data
      # Connector modules of your own (one folder each), with MODULES_DIR=/modules in .env:
      # - ./modules:/modules:ro
    # Reachable only from this machine by default.
    # To open it to your LAN without the HTTPS proxy, use "8080:8080".
    ports:
      - "127.0.0.1:8080:8080"
    # Resources (README, section 1, "Memory and CPU"): measured 125 MB for 5 000 assets, 340 MB at peak
    # for 30 000. Uncomment to cap the container; raise the memory if connectors run often.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M
    #     reservations:
    #       memory: 128M

  # Optional HTTPS reverse proxy: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [strata]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  strata-data:
    name: strata-data
  caddy-data:
  caddy-config:
